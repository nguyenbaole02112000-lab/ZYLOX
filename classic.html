<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ZYLOX - Classic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif}
.game-container{position:relative;width:100vw;height:100vh;background:#70c5ce;overflow:hidden;container-type:size}
#gameCanvas{display:block;width:100%;height:100%;position:absolute;inset:0;z-index:200;cursor:pointer;background:transparent}
#exitGameBtn{position:absolute;top:2cqw;right:2cqw;z-index:300;display:flex;width:5cqw;height:5cqw;background:linear-gradient(180deg,#ff5252,#d32f2f);border:.2cqw solid #b71c1c;border-radius:50%;cursor:pointer;box-shadow:0 .4cqw 0 #b71c1c,0 .6cqw 1cqw rgba(0,0,0,.5);align-items:center;justify-content:center;transition:transform .1s,filter .1s}
#exitGameBtn:hover{filter:brightness(1.1)}
#exitGameBtn:active{transform:scale(.9) translateY(.2cqw);box-shadow:0 .1cqw 0 #b71c1c,0 .2cqw .5cqw rgba(0,0,0,.5)}
#exitGameBtn::before,#exitGameBtn::after{content:'';position:absolute;width:50%;height:.4cqw;background:#fff;border-radius:1cqw}
#exitGameBtn::before{transform:rotate(45deg)}
#exitGameBtn::after{transform:rotate(-45deg)}
</style>
</head>
<body>
<div class="game-container">
<canvas id="gameCanvas"></canvas>
<div id="exitGameBtn" onclick="exitToLobby()" title="Thoát"></div>
</div>
<script>
function bestKey(n){return 'flappy_best_'+n.toLowerCase()}
function loadBest(n){return +localStorage.getItem(bestKey(n))||0}
function saveBest(n,v){localStorage.setItem(bestKey(n),v)}
let pSpd=+localStorage.getItem('zylox_speed')||4,diffName=localStorage.getItem('zylox_diff')||'Easy',best=loadBest(diffName);
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),BH=540,PW=60,PG=150,PD=480,GRAV=0.7,FLP=-10;
let W=960,H=BH,scl=1,cSpd=4,state='ready',score=0,frame=0;
const cr={x:120,y:H/2,r:14,vy:0,rot:0};let pipes=[],parts=[];
function resizeCanvas(){const vw=canvas.clientWidth,vh=canvas.clientHeight;scl=vh/BH;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);W=vw/scl;ctx.setTransform(scl*dpr,0,0,scl*dpr,0,0);H=BH;if(cr.y>H-100||cr.y<0)cr.y=H/2;if(state==='playing'&&pipes.length>0){let lp=pipes[pipes.length-1];while(lp.x<W+PD){const th=60+Math.random()*(H-PG-120);const np={x:lp.x+PD,topHeight:th,scored:false};pipes.push(np);lp=np}}}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();
function resetGame(){state='playing';score=0;frame=0;cSpd=pSpd;cr.y=H/2;cr.vy=0;cr.rot=0;pipes=[];parts=[]}
function flap(){if(state==='ready'){resetGame();cr.vy=FLP}else if(state==='playing')cr.vy=FLP;else if(state==='gameover')resetGame()}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
canvas.addEventListener('mousedown',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap()},{passive:false});
function drawPipe(p){const g=ctx.createLinearGradient(p.x,0,p.x+PW,0);g.addColorStop(0,'#5cb85c');g.addColorStop(0.5,'#8ee08e');g.addColorStop(1,'#3d8b3d');ctx.fillStyle=g;ctx.fillRect(p.x,0,PW,p.topHeight);ctx.fillRect(p.x,p.topHeight+PG,PW,H-p.topHeight-PG);ctx.strokeStyle='#2e5e2e';ctx.lineWidth=2;ctx.strokeRect(p.x,0,PW,p.topHeight);ctx.strokeRect(p.x,p.topHeight+PG,PW,H-p.topHeight-PG);ctx.fillStyle='#6ecf6e';ctx.fillRect(p.x-4,p.topHeight-20,PW+8,20);ctx.fillRect(p.x-4,p.topHeight+PG,PW+8,20);ctx.strokeRect(p.x-4,p.topHeight-20,PW+8,20);ctx.strokeRect(p.x-4,p.topHeight+PG,PW+8,20)}
function drawCreature(){ctx.save();ctx.translate(cr.x,cr.y);ctx.rotate(cr.rot);ctx.fillStyle='#f7d51d';ctx.beginPath();ctx.arc(0,0,cr.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c9a800';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(-3,4,cr.r*0.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-5,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(6.5,-5,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f39c12';ctx.beginPath();ctx.moveTo(cr.r-2,0);ctx.lineTo(cr.r+8,3);ctx.lineTo(cr.r-2,7);ctx.closePath();ctx.fill();ctx.fillStyle='#f0c419';ctx.beginPath();ctx.ellipse(-6,0,8,5,Math.sin(frame*0.2)*0.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
function drawBackground(){const sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#70c5ce');sg.addColorStop(1,'#a8e6ef');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<Math.ceil(W/200);i++){const cx=((frame*0.3+i*220)%(W+150))-80,cy=70+(i%3)*70;ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.arc(cx+25,cy,30,0,Math.PI*2);ctx.arc(cx+55,cy,25,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ded895';ctx.fillRect(0,H-60,W,60);ctx.fillStyle='#c9c26a';const gs=(state==='playing')?cSpd:0;for(let i=0;i<W;i+=20)ctx.fillRect(i-(frame*gs)%20,H-60,10,60)}
function update(){frame++;parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0});if(state!=='playing')return;cr.vy+=GRAV;cr.y+=cr.vy;cr.rot=(cr.vy<0)?-0.4:Math.min(Math.PI/2,cr.vy*0.12);cSpd=pSpd+Math.min(score*0.05,2.5);if(pipes.length===0||pipes[pipes.length-1].x<=W-PD){const th=60+Math.random()*(H-PG-120);pipes.push({x:W,topHeight:th,scored:false})}for(const p of pipes){p.x-=cSpd;if(!p.scored&&cr.x>p.x+PW){p.scored=true;score++;if(score>best){best=score;saveBest(diffName,best)}}if(cr.x+cr.r>p.x&&cr.x-cr.r<p.x+PW){if(cr.y-cr.r<p.topHeight||cr.y+cr.r>p.topHeight+PG)gameOver()}}pipes=pipes.filter(p=>p.x+PW>0);if(cr.y+cr.r>H-60||cr.y-cr.r<0)gameOver()}
function gameOver(){if(state==='gameover')return;state='gameover';for(let i=0;i<15;i++)parts.push({x:cr.x,y:cr.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,life:30,color:['#f7d51d','#fff','#f39c12'][i%3]})}
function render(){drawBackground();pipes.forEach(drawPipe);if(state!=='gameover')drawCreature();parts.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.font='bold 48px Arial';ctx.textAlign='center';ctx.strokeText(score,W/2,80);ctx.fillText(score,W/2,80);ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.strokeText('Best: '+best,15,30);ctx.fillText('Best: '+best,15,30);if(state==='ready'){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(W/2-260,H/2-90,520,180);ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText('🐉 ZYLOX',W/2,H/2-35);ctx.font='19px Arial';ctx.fillText('Press SPACE / Click to fly',W/2,H/2+10);ctx.fillText('Endless fun!',W/2,H/2+45)}else if(state==='gameover'){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W/2-220,H/2-110,440,220);ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-45);ctx.font='bold 24px Arial';ctx.fillText('Score: '+score,W/2,H/2+5);ctx.fillStyle='#f7d51d';ctx.fillText('Best: '+best,W/2,H/2+45);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Press SPACE / Click to restart',W/2,H/2+85)}}
let lastT=performance.now(),acc=0;
function loop(t){const dt=Math.min(t-lastT,250);lastT=t;acc+=dt;while(acc>=16.666){update();acc-=16.666}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function exitToLobby(){window.location.href='lobby.html'}
</script>
</body>
</html>
