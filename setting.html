<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>LOBBY - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{width:100vw;height:100vh;background:#0a0612;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif;overflow:hidden}
.settings{position:relative;width:90vw;max-width:900px;aspect-ratio:16/9;max-height:90vh;background:radial-gradient(ellipse at top,#2a1a4a 0%,#140a24 50%,#0a0612 100%);border-radius:20px;border:2px solid #6b4fa0;box-shadow:0 0 60px rgba(138,92,255,.3),0 0 120px rgba(138,92,255,.15),inset 0 0 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column}
.settings::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#fff,transparent),radial-gradient(2px 2px at 50% 30%,#b794f6,transparent),radial-gradient(1px 1px at 70% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#b794f6,transparent),radial-gradient(2px 2px at 20% 90%,#fff,transparent),radial-gradient(1px 1px at 90% 50%,#fff,transparent),radial-gradient(1px 1px at 45% 75%,#b794f6,transparent);opacity:.6;pointer-events:none;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:.8}}
.ccb{position:absolute;top:20px;right:20px;width:44px;height:44px;background:linear-gradient(180deg,#ff5252,#d32f2f);border:2px solid #b71c1c;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #b71c1c,0 6px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;transition:transform .1s;z-index:10}
.ccb:hover{filter:brightness(1.1)}
.ccb:active{transform:scale(.9) translateY(2px);box-shadow:0 2px 0 #b71c1c,0 4px 8px rgba(0,0,0,.5)}
.ccb::before,.ccb::after{content:'';position:absolute;width:55%;height:4px;background:#fff;border-radius:4px}
.ccb::before{transform:rotate(45deg)}
.ccb::after{transform:rotate(-45deg)}
.settings.entity-mode .ccb{top:10px;right:10px;width:34px;height:34px}
.title{position:relative;text-align:center;padding:15px 0 5px;font-size:24px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#e0c8ff;text-shadow:0 0 10px #8a5cff,0 0 20px #8a5cff,0 0 40px #6b3fcf;z-index:2;font-family:'Cinzel',serif}
.title::after{content:'';display:block;width:200px;height:2px;margin:8px auto 0;background:linear-gradient(90deg,transparent,#8a5cff,transparent);box-shadow:0 0 10px #8a5cff}
.settings.entity-mode .title{font-size:17px;padding:14px 0 0;letter-spacing:.25em}
.settings.entity-mode .title::after{width:140px;margin:6px auto 0}
.main-view{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;padding:5px 20px 15px;overflow:hidden}
.tab-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;height:100%;transition:opacity .3s;padding-right:5px}
.tab-list::-webkit-scrollbar{width:4px}.tab-list::-webkit-scrollbar-track{background:transparent}.tab-list::-webkit-scrollbar-thumb{background:#6b4fa0;border-radius:3px}
.tab{position:relative;display:flex;align-items:center;gap:16px;padding:12px 20px;background:rgba(42,26,74,.5);border:1px solid rgba(138,92,255,.3);border-radius:10px;cursor:pointer;transition:all .25s ease;backdrop-filter:blur(4px)}
.tab:hover{background:rgba(59,37,98,.7);border-color:rgba(138,92,255,.8);box-shadow:0 0 20px rgba(138,92,255,.4),inset 0 0 20px rgba(138,92,255,.1);transform:translateX(6px)}
.tab-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.6);border:1px solid rgba(138,92,255,.4);border-radius:8px;box-shadow:inset 0 0 12px rgba(138,92,255,.2);flex-shrink:0;transition:all .25s ease}
.tab:hover .tab-icon{box-shadow:inset 0 0 12px rgba(138,92,255,.4),0 0 15px rgba(138,92,255,.5);border-color:#b794f6}
.tab-icon svg{width:24px;height:24px;stroke:#b794f6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(183,148,246,.6));transition:all .25s ease}
.tab:hover .tab-icon svg{stroke:#e0c8ff;filter:drop-shadow(0 0 8px rgba(183,148,246,1))}
.demon{position:relative;width:22px;height:22px;display:flex;justify-content:center;align-items:center;gap:2.5px}
.demon::before{content:'';position:absolute;width:16px;height:16px;background:#1a0a2e;border:2px solid #b794f6;border-radius:50%;z-index:1;box-shadow:0 0 8px rgba(183,148,246,.8);transition:border-color .25s ease,box-shadow .25s ease}
.demon-eye{position:relative;z-index:2;width:6px;height:3px;background:#b794f6;border-radius:6px 6px 0 0;transform-origin:center bottom;box-shadow:0 0 5px #b794f6;transition:background .25s ease,box-shadow .25s ease}
.demon-eye.left{transform:rotate(-135deg)}
.demon-eye.right{transform:rotate(135deg)}
.tab:hover .demon::before{border-color:#e0c8ff;box-shadow:0 0 12px rgba(224,200,255,1),0 0 22px rgba(183,148,246,.8)}
.tab:hover .demon-eye{background:#e0c8ff;box-shadow:0 0 6px #e0c8ff,0 0 11px rgba(224,200,255,.9)}
.tab-name{font-size:18px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#e0c8ff;text-shadow:0 0 6px rgba(138,92,255,.6),0 2px 4px rgba(0,0,0,.8)}
.tab:hover .tab-name{color:#fff;text-shadow:0 0 10px #b794f6,0 0 20px #8a5cff,0 2px 4px rgba(0,0,0,.8)}
.tab-arrow{margin-left:auto;font-size:18px;color:#8a5cff;opacity:.4;transition:all .25s ease}
.tab:hover .tab-arrow{opacity:1;color:#b794f6;transform:translateX(4px)}
.perf-view{position:absolute;inset:10px 30px 20px;display:none;flex-direction:column;justify-content:center;align-items:center;animation:fadeIn .3s ease;z-index:2}
.perf-view.show{display:flex}
.setting-view{inset:4px 25px 8px;justify-content:flex-start;align-items:stretch;gap:8px;min-height:0}
.setting-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 6px}
.setting-list::-webkit-scrollbar{width:4px}.setting-list::-webkit-scrollbar-thumb{background:#6b4fa0;border-radius:3px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid rgba(138,92,255,.35);border-radius:9px;background:rgba(42,26,74,.5);color:#e0c8ff;font-size:14px;font-weight:700}
.setting-row select{min-width:120px;padding:7px 10px;border:1px solid #8a5cff;border-radius:7px;background:#1b1032;color:#fff;font:inherit;cursor:pointer}
.setting-section{padding:5px 2px 0;color:#f7d51d;font:900 13px Cinzel,serif;letter-spacing:.12em;text-transform:uppercase}
.setting-row.volume-row{display:grid;grid-template-columns:minmax(70px,1fr) minmax(80px,2fr) 45px}
.volume-row input{width:100%;accent-color:#b794f6}
.volume-row output{text-align:right;color:#f7d51d}
.setting-account{width:100%;text-align:left;cursor:pointer;font:inherit}.setting-account:hover{border-color:#b794f6;background:rgba(59,37,98,.8)}
.setting-footer{display:flex;justify-content:center;flex-shrink:0}.setting-footer .perf-back{margin:0}
.inventory-view{inset:4px 25px 8px;align-items:stretch;justify-content:flex-start;gap:8px}.inventory-list{flex:1;min-height:0;overflow:auto;padding:4px}.inventory-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #6b4fa0;border-radius:9px;background:rgba(42,26,74,.6);color:#e0c8ff;font-weight:700}.inventory-view .perf-back{align-self:center;margin:0}
.inventory-item+.inventory-item{margin-top:8px}.ghost-badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:8px;border:2px solid #b794f6;border-radius:50%;background:radial-gradient(circle,#5a397b,#1b1032);box-shadow:0 0 10px rgba(183,148,246,.55);font-size:17px;vertical-align:middle}.inventory-item[hidden]{display:none}
.music-view{justify-content:flex-start;gap:5px;inset:4px 30px 8px}
.music-list{width:min(100%,480px);flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px}
.music-list::-webkit-scrollbar{width:4px}.music-list::-webkit-scrollbar-thumb{background:#6b4fa0;border-radius:3px}
.music-track{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid #6b4fa0;border-radius:8px;background:rgba(42,26,74,.6);color:#e0c8ff;font-weight:700;text-align:left;cursor:pointer}
.music-track:hover{border-color:#b794f6;background:rgba(59,37,98,.8)}
.music-track.active{border-color:#f7d51d;color:#fff;box-shadow:0 0 10px rgba(247,215,29,.35)}
.music-track .track-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-track .track-state{color:#f7d51d;font-size:11px;flex-shrink:0}
.music-add{display:block;text-align:center;border-style:dashed;cursor:pointer}
.music-status{color:#b794f6;font-size:12px;text-align:center;min-height:1em}
.music-controls{display:flex;justify-content:center;gap:8px}
.music-controls .perf-back{margin:0}
.music-controls .perf-back:disabled{opacity:.45;cursor:default}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.perf-title{font-size:clamp(12px,2vw,20px);font-weight:900;color:#f7d51d;text-transform:uppercase;letter-spacing:.15em;text-shadow:0 0 15px rgba(247,213,29,.8);margin:6px 0}
.perf-options{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.perf-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;background:rgba(42,26,74,.6);border:2px solid rgba(138,92,255,.4);border-radius:8px;cursor:pointer;transition:all .2s;color:#fff;min-width:62px;backdrop-filter:blur(4px);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.perf-btn:hover{background:rgba(59,37,98,.8);transform:translateY(-5px);border-color:#b794f6;box-shadow:0 8px 20px rgba(138,92,255,.5)}
.perf-btn.active{background:linear-gradient(180deg,#ffe600,#ffa500);color:#000;border-color:#fff;box-shadow:0 0 25px rgba(247,213,29,.8)}
.perf-name{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.perf-num{font-size:13px;font-weight:bold;opacity:.8}
.perf-btn.active .perf-num{opacity:1}
.perf-back{margin-top:20px;padding:8px 20px;background:rgba(255,255,255,.1);border:2px solid rgba(138,92,255,.5);border-radius:30px;color:#e0c8ff;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.perf-back:hover{background:rgba(138,92,255,.3);color:#fff;box-shadow:0 0 15px rgba(138,92,255,.6)}
.entity-view{position:absolute;inset:6px 25px 10px;display:none;flex-direction:column;gap:8px;animation:fadeIn .3s ease;z-index:2}
.entity-view.show{display:flex}
.e-top{display:flex;justify-content:space-between;gap:10px;height:40%}
.e-panel{background:rgba(20,10,36,.8);border:1px solid rgba(138,92,255,.4);border-radius:12px;box-shadow:inset 0 0 20px rgba(138,92,255,.1),0 5px 15px rgba(0,0,0,.5);padding:8px;display:flex;flex-direction:column}
.e-col-map{width:25%}
.e-col-passive{width:28%}
.e-col-model-wrap{width:42%;display:flex;flex-direction:column;gap:5px}
.e-col-model{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:#000;border:2px solid #6b4fa0;border-radius:12px;position:relative;box-shadow:inset 0 0 30px #000;overflow:hidden}
#batModelCanvas{position:absolute;width:74.074074vh;height:74.074074vh;max-width:none;pointer-events:none}
.e-model-name{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#f7d51d;text-shadow:0 0 8px #f7d51d}
.e-equip-btn{padding:4px 0;border:2px solid #fff;border-radius:30px;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#000;background:linear-gradient(180deg,#ffe600,#ffa500);box-shadow:0 0 15px rgba(247,213,29,.6);transition:all .2s}
.e-equip-btn:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(247,213,29,.9)}
.e-equip-btn.equipped{background:rgba(42,26,74,.8);color:#b794f6;border-color:#6b4fa0;box-shadow:none;cursor:default;transform:none}
.e-map-title,.e-passive-title{font-size:12px;font-weight:bold;color:#f7d51d;text-align:center;margin-bottom:5px;font-family:'Cinzel',serif}
.e-map-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.e-map-item{height:38px;background:url('https://images.unsplash.com/photo-1508361001413-7a9dca21d08a?q=80&w=200&auto=format&fit=crop') center/cover;border:2px solid #6b4fa0;border-radius:6px;position:relative;cursor:pointer;flex-shrink:0}
.e-map-item::after{content:attr(data-label);position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:10px;font-weight:900;color:#fff;text-shadow:0 0 5px #000;background:rgba(0,0,0,0.7);padding:1px 6px;border-radius:4px;white-space:nowrap}
.e-passive-content{flex:1;display:flex;justify-content:center;align-items:center;text-align:center;padding:5px;background:rgba(0,0,0,0.6);border:1px dashed rgba(138,92,255,0.5);border-radius:6px;font-size:14px;font-weight:bold;color:#b794f6;text-shadow:0 0 5px rgba(138,92,255,0.5)}
.e-bottom{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.e-filter-header{display:flex;align-items:center;margin-bottom:8px;gap:10px}
.e-filter-title{font-size:14px;color:#f7d51d;text-transform:uppercase;font-weight:bold;font-family:'Cinzel',serif}
.e-filter-btn{background:rgba(138,92,255,.2);border:1px solid #8a5cff;color:#e0c8ff;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;transition:all .2s;display:flex;align-items:center;gap:6px}
.e-filter-btn:hover{background:rgba(138,92,255,.4);box-shadow:0 0 10px rgba(138,92,255,.5)}
.e-filter-dropdown{position:absolute;top:34px;left:55px;z-index:10;background:#140a24;border:1px solid #6b4fa0;border-radius:6px;box-shadow:0 5px 15px rgba(0,0,0,0.8);display:none;flex-direction:column;min-width:120px}
.e-filter-dropdown.show{display:flex}
.e-filter-option{padding:8px 12px;font-size:13px;cursor:pointer;color:#e0c8ff;border-bottom:1px solid rgba(138,92,255,.2);transition:background 0.2s}
.e-filter-option:last-child{border-bottom:none}
.e-filter-option:hover{background:rgba(138,92,255,.3);color:#fff}
.e-char-list{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;overflow-x:hidden;overflow-y:auto;background:rgba(0,0,0,.6);border:1px solid rgba(138,92,255,.3);border-radius:8px;padding:12px}
.e-char-list::-webkit-scrollbar{width:4px}
.e-char-list::-webkit-scrollbar-thumb{background:#6b4fa0;border-radius:3px}
.e-char-slot{position:relative;width:45px;height:45px;background:rgba(42,26,74,.8);border:2px solid #6b4fa0;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;justify-content:center;align-items:center;flex-shrink:0;overflow:hidden}
.e-char-slot.common{background:#565a61}.e-char-slot.epic{background:#69368f}.e-char-slot.mythical{background:#943b42}.e-char-slot .lock-mark{position:absolute;right:0;bottom:0;font-size:12px;line-height:1}
.entity-rarity{text-align:center;font-size:11px;color:#e0c8ff;font-weight:bold}.e-equip-btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.e-char-slot:hover{border-color:#f7d51d;box-shadow:0 0 10px #f7d51d;transform:scale(1.1)}
.e-char-slot.active{border-color:#f7d51d;box-shadow:0 0 10px #f7d51d,inset 0 0 10px rgba(247,213,29,.5)}
.e-char-slot.hidden{display:none}
.e-char-slot canvas{width:100%;height:100%}
.settings::after{content:'';position:absolute;inset:-2px;border-radius:20px;padding:2px;background:linear-gradient(135deg,#8a5cff,transparent 40%,transparent 60%,#b794f6);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;pointer-events:none;animation:borderGlow 3s ease-in-out infinite}
@keyframes borderGlow{0%,100%{opacity:.3}50%{opacity:.8}}
</style></head><body>
<div class="settings" id="settingsBox">
  <div class="ccb" onclick="window.location.href='index.html'"></div>
  <div class="title" id="mainTitle">⚜ Menu ⚜</div>
  <div class="main-view">
    <div class="tab-list" id="tabList">
      <div class="tab" onclick="openEntity()"><div class="tab-icon"><div class="demon"><div class="demon-eye left"></div><div class="demon-eye right"></div></div></div><div class="tab-name">Entity</div><div class="tab-arrow">▸</div></div>
      <div class="tab" onclick="openInventory()"><div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/><path d="M4 13h16"/><path d="M12 13v3"/></svg></div><div class="tab-name">Inventory</div><div class="tab-arrow">▸</div></div>
      <div class="tab"><div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18l-2 13H5L3 6z"/><path d="M8 6V4h8v2"/><circle cx="9" cy="13" r="1.2" fill="#b794f6" stroke="none"/><circle cx="15" cy="13" r="1.2" fill="#b794f6" stroke="none"/><path d="M9 17h6"/></svg></div><div class="tab-name">Shop</div><div class="tab-arrow">▸</div></div>
      <div class="tab" onclick="openMusic()"><div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="tab-name">Music</div><div class="tab-arrow">▸</div></div>
      <div class="tab" onclick="openPerf()"><div class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div><div class="tab-name">Setting</div><div class="tab-arrow">▸</div></div>
    </div>
    
    <div class="perf-view setting-view" id="perfView">
      <div class="setting-list">
        <div class="setting-section">Performance</div>
        <label class="setting-row"><span>Physics FPS</span><select id="physicsFPS" onchange="setPhysicsFPS(Number(this.value))"><option value="60">60 FPS</option><option value="90">90 FPS</option><option value="120">120 FPS</option></select></label>
        <label class="setting-row"><span>Render FPS</span><select id="renderFPS" onchange="setFPS(Number(this.value))"><option value="30">30 FPS</option><option value="45">45 FPS</option><option value="60">60 FPS</option><option value="90">90 FPS</option><option value="120">120 FPS</option><option value="0">Unlimited</option></select></label>
        <div class="setting-section">Audio</div>
        <label class="setting-row volume-row"><span>Music</span><input type="range" min="0" max="100" step="1" id="volumeMusic" oninput="changeVolume('music',this.value)"><output id="volumeMusicValue"></output></label>
        <label class="setting-row volume-row"><span>UI</span><input type="range" min="0" max="100" step="1" id="volumeUi" oninput="changeVolume('ui',this.value)"><output id="volumeUiValue"></output></label>
        <label class="setting-row volume-row"><span>Gameplay</span><input type="range" min="0" max="100" step="1" id="volumeGame" oninput="changeVolume('game',this.value)"><output id="volumeGameValue"></output></label>
        <button type="button" class="setting-row setting-account" onclick="window.ZyloxAccount.showAccount()"><span>Account</span><span aria-hidden="true">▸</span></button>
      </div>
      <div class="setting-footer"><button class="perf-back" onclick="closeAllViews()">← Back</button></div>
    </div>
    
    <div class="perf-view inventory-view" id="inventoryView">
      <div class="inventory-list"><div class="inventory-item"><span>🍬 Candy</span><strong id="inventoryCandy">0</strong></div><div class="inventory-item" id="inventoryGhost" hidden><span><span class="ghost-badge" aria-hidden="true">👻</span>Ghost Token</span><strong>1</strong></div></div>
      <button class="perf-back" onclick="closeAllViews()">&#8592; Back</button>
    </div>
    <div class="perf-view music-view" id="musicView">

<script>
  const tabList = document.getElementById('tabList');
  const perfView = document.getElementById('perfView');
  const entityView = document.getElementById('entityView');
  const mainTitle = document.getElementById('mainTitle');
  const settingsBox = document.getElementById('settingsBox');
  function closeAllViews() {
    perfView.classList.remove('show');
    entityView.classList.remove('show');
    document.getElementById('musicView').classList.remove('show');
    document.getElementById('inventoryView').classList.remove('show');
    settingsBox.classList.remove('entity-mode');
    mainTitle.textContent = '⚜ Menu ⚜';
    tabList.style.display = 'flex';
  }
  function openPerf() {
    closeAllViews();
    tabList.style.display = 'none';
    mainTitle.textContent = '⚜ Setting ⚜';
    settingsBox.classList.add('entity-mode');
    perfView.classList.add('show');
    ['music','ui','game'].forEach(channel => updateVolumeControl(channel));
  }
  function updateVolumeControl(channel) {
    const name = channel === 'ui' ? 'Ui' : channel[0].toUpperCase() + channel.slice(1);
    const value = window.ZyloxSound.getVolume(channel);
    document.getElementById('volume' + name).value = value;
    document.getElementById('volume' + name + 'Value').textContent = value + '%';
  }
  function changeVolume(channel, value) {
    window.ZyloxSound.setVolume(channel, value);
    updateVolumeControl(channel);
  }
  function openEntity() {
    closeAllViews();
    tabList.style.display = 'none';
    mainTitle.textContent = '⚜ Entity ⚜';
    settingsBox.classList.add('entity-mode');
    entityView.classList.add('show');
    updateEquipBtn();
  }
  function openInventory(){
    closeAllViews();
    tabList.style.display='none';
    mainTitle.textContent='Inventory';
    settingsBox.classList.add('entity-mode');
    const n=Number(window.ZyloxAccount?.getCandy() || 0);
    document.getElementById('inventoryCandy').textContent=Number.isSafeInteger(n)&&n>0?n:0;
    document.getElementById('inventoryView').classList.add('show');
    refreshGhostInventory();
  }
  async function refreshGhostInventory(){
    const item=document.getElementById('inventoryGhost'),account=window.ZyloxAccount;
    if(!account?.ready){item.hidden=true;return}
    const owner=account.account?.id;
    try{const state=account.isOfflineGuest?account.guestGhostState():account.isOnline?await window.BaoCloud.rpc('ghost_state'):null;
      if(window.ZyloxAccount?.account?.id===owner)item.hidden=!state?.purchased||!!state.claimed;
    }catch(_){item.hidden=true}
  }
  function openMusic(){
    closeAllViews();
    tabList.style.display='none';
    mainTitle.textContent='⚜ Music ⚜';
    settingsBox.classList.add('entity-mode');
    document.getElementById('musicView').classList.add('show');
    updateMusicView();
  }
  function updateMusicView(){
    const music=window.ZyloxMusic;
    if(!music)return;
    const state=music.getState();
    document.getElementById('musicStatus').textContent=state.status||'';
    const button=document.getElementById('musicPlay');
    button.disabled=!state.name;
    button.textContent=state.playing?'Pause':'Play';
    const selected=state.selectedId||'none';
    const none=document.getElementById('musicNone');
    none.classList.toggle('active',selected==='none');
    none.setAttribute('aria-pressed',String(selected==='none'));
    none.querySelector('.track-state').textContent=selected==='none'?'Selected':'';
    const list=document.getElementById('musicTracks');
    list.replaceChildren();
    (state.tracks||[]).forEach(track=>{
      const item=document.createElement('button');item.type='button';item.className='music-track';
      const active=selected===track.id;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active));
      const name=document.createElement('span');name.className='track-name';name.textContent=track.name;
      const marker=document.createElement('span');marker.className='track-state';marker.textContent=active?'Selected':'';
      item.append(name,marker);item.addEventListener('click',()=>chooseMusic(track.id));list.appendChild(item);
    });
  }
  function chooseMusic(id){window.ZyloxMusic.selectTrack(id);}
  async function selectMusic(input){
    if(input.files[0])await window.ZyloxMusic.select(input.files[0]);
    input.value='';
    updateMusicView();
  }
  function toggleMusic(){window.ZyloxMusic.toggle();}
  if(!localStorage.getItem('zylox_entity'))localStorage.setItem('zylox_entity','Bat');
  const allowedRenderFPS = [0,30,45,60,90,120], allowedPhysicsFPS = [60,90,120];
  const savedRenderFPS = localStorage.getItem('zylox_fps');
  let selectedFPS = savedRenderFPS !== null && allowedRenderFPS.includes(Number(savedRenderFPS)) ? Number(savedRenderFPS) : 45;
  let selectedPhysicsFPS = Number(localStorage.getItem('zylox_physics_fps'));
  if(!allowedPhysicsFPS.includes(selectedPhysicsFPS))selectedPhysicsFPS=60;
  function setFPS(fps){ if(!allowedRenderFPS.includes(fps))return; selectedFPS = fps; localStorage.setItem('zylox_fps', fps); updateFPSButtons(); }
  function setPhysicsFPS(fps){ if(!allowedPhysicsFPS.includes(fps))return; selectedPhysicsFPS = fps; localStorage.setItem('zylox_physics_fps', fps); updateFPSButtons(); }
  function updateFPSButtons(){
    document.getElementById('renderFPS').value = String(selectedFPS);
    document.getElementById('physicsFPS').value = String(selectedPhysicsFPS);
  }
  updateFPSButtons();
  const equipBtn = document.getElementById('equipBtn');
  function updateEquipBtn(){
    const eq = localStorage.getItem('zylox_entity') === 'Bat';
    equipBtn.textContent = eq ? 'Equipped' : 'Equip';
    equipBtn.classList.toggle('equipped', eq);
  }
  function equipEntity(){
    localStorage.setItem('zylox_entity', 'Bat');
    updateEquipBtn();
  }
  if(new URLSearchParams(window.location.search).get('view')==='entity')openEntity();
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');
  const filterText = document.getElementById('filterText');
  function toggleFilterMenu(e) {
    e.stopPropagation();
    filterMenu.classList.toggle('show');
  }
  function selectFilter(mapName) {
    filterText.textContent = mapName;
    filterMenu.classList.remove('show');
    filterCharacters(mapName);
  }
  function filterCharacters(mapName) {
    document.querySelectorAll('.e-char-slot').forEach(char => {
      const charMaps = char.getAttribute('data-maps').split(',');
      char.classList.toggle('hidden', !(mapName === 'All' || charMaps.includes(mapName)));
    });
  }
  document.addEventListener('click', (e) => {
    if (!filterBtn.contains(e.target) && !filterMenu.contains(e.target)) {
      filterMenu.classList.remove('show');
    }
  });
  function drawBatWings(ctx, x, y) {
    ctx.save();ctx.translate(x + 7, y - 3);ctx.rotate(86 * Math.PI / 180);
    ctx.fillStyle = '#2a0a3a'; ctx.strokeStyle = '#b794f6'; ctx.lineWidth = 2;
    ctx.shadowBlur = 15;ctx.shadowColor = '#8a5cff';
    ctx.beginPath();ctx.moveTo(0, 0);ctx.bezierCurveTo(15, -20, 35, -5, 45, 15);ctx.bezierCurveTo(35, 20, 30, 25, 25, 30);ctx.bezierCurveTo(20, 20, 15, 20, 10, 25);ctx.bezierCurveTo(5, 15, 0, 10, 0, 0);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(0, 0);ctx.quadraticCurveTo(20, 0, 45, 15);ctx.moveTo(5, 5);ctx.quadraticCurveTo(25, 10, 25, 30);ctx.moveTo(2, 2);ctx.quadraticCurveTo(15, 15, 10, 25);ctx.strokeStyle = 'rgba(183,148,246,.4)';ctx.lineWidth = 1.5;ctx.stroke();ctx.restore();
  }
  function drawBatBody(ctx, x, y) {
  ctx.save();ctx.translate(x,y);ctx.shadowBlur=14;ctx.shadowColor='#8a5cff';
  const g=ctx.createRadialGradient(-4,-8,2,0,3,22);g.addColorStop(0,'#684778');g.addColorStop(.55,'#352044');g.addColorStop(1,'#12091e');
  ctx.fillStyle=g;ctx.strokeStyle='#a47ae6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(-13,-23);ctx.quadraticCurveTo(-7,-20,-4,-15);ctx.quadraticCurveTo(2,-17,6,-15);ctx.lineTo(13,-24);ctx.lineTo(12,-10);ctx.quadraticCurveTo(16,-4,15,4);ctx.quadraticCurveTo(15,18,4,20);ctx.quadraticCurveTo(-10,21,-14,9);ctx.quadraticCurveTo(-17,-2,-12,-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle='#9c72b5';ctx.beginPath();ctx.moveTo(-11,-20);ctx.lineTo(-9,-12);ctx.lineTo(-6,-15);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(11,-21);ctx.lineTo(7,-14);ctx.lineTo(11,-11);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(190,151,214,.22)';ctx.beginPath();ctx.ellipse(0,10,8,7,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=8;ctx.shadowColor='#ff334e';ctx.fillStyle='#ff596a';ctx.beginPath();ctx.ellipse(5,-4,3,2.5,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5.8,-4.5,.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(4,5);ctx.lineTo(6,9);ctx.lineTo(8,5);ctx.closePath();ctx.fill();ctx.restore();
  }
  const batModelCanvas = document.getElementById('batModelCanvas');
  const batModelCtx = batModelCanvas.getContext('2d');
  batModelCtx.clearRect(0, 0, batModelCanvas.width, batModelCanvas.height);
  batModelCtx.save();
  batModelCtx.translate(200, 200);
  batModelCtx.scale(0.8, 0.8);
  drawBatBody(batModelCtx, 0, 0);
  drawBatWings(batModelCtx, 0, 0);
  batModelCtx.restore();
  const batIconCanvas = document.getElementById('batIconCanvas');
  const batIconCtx = batIconCanvas.getContext('2d');
  batIconCtx.clearRect(0, 0, batIconCanvas.width, batIconCanvas.height);
  batIconCtx.save();
  batIconCtx.translate(50, 50);
  batIconCtx.scale(0.75, 0.75);
  drawBatBody(batIconCtx, 0, 0);
  drawBatWings(batIconCtx, 0, 0);
  batIconCtx.restore();
document.addEventListener('zylox-progress-updated',()=>{document.getElementById('inventoryCandy').textContent=window.ZyloxAccount?.getCandy()||0});
